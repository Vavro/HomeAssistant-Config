- id: '1728585593651'
  alias: Living Room Morning Radio when lights turn on
  description: ''
  triggers:
  - type: turned_on
    device_id: 58ea5f112bb39d970ec7559b6bf6295d
    entity_id: f68275a1d26dad04530dd8198ec4742b
    domain: light
    trigger: device
    for:
      hours: 0
      minutes: 0
      seconds: 4
  - type: turned_on
    device_id: 34a279c00dc5b2bd5a73b5c7054707ab
    entity_id: dd986af01a17dbf45f7e657c245f7a76
    domain: light
    trigger: device
    for:
      hours: 0
      minutes: 0
      seconds: 4
  - type: turned_on
    device_id: 0a4af1c5b8c683a063d3b19922ed30a7
    entity_id: a66bb6bc3089ca25bca38a5d824229c8
    domain: light
    trigger: device
    for:
      hours: 0
      minutes: 0
      seconds: 4
  conditions:
  - condition: time
    weekday:
    - mon
    - tue
    - wed
    - thu
    - fri
    before: 06:45:00
    after: 05:55:00
  - condition: not
    conditions:
    - condition: device
      device_id: 55783b7df92e11eabf886bf57f72e81e
      domain: media_player
      entity_id: f24e24c6be67eedf11915c554bd13048
      type: is_playing
  actions:
  - action: media_player.volume_set
    data:
      volume_level: 0.3
    target:
      entity_id: media_player.living_room_soundbar
    continue_on_error: true
  - action: media_player.play_media
    target:
      entity_id: media_player.living_room_soundbar
    data:
      media_content_id: media-source://radio_browser/1b568695-9ce7-493d-ba72-d9b3d5e0a364
      media_content_type: audio/mpeg
    metadata:
      title: Evropa 2 - Radio
      thumbnail: https://m.actve.net/e2/favicon/apple-touch-icon.png
      media_class: music
    continue_on_error: true
  - wait_template: "{{ is_state('media_player.living_room_soundbar', 'playing') }}"
    timeout: "00:00:15"
    continue_on_timeout: true
  - if:
    - condition: not
      conditions:
      - condition: state
        entity_id: media_player.living_room_soundbar
        state: playing
    then:
    - action: media_player.volume_set
      data:
        volume_level: 0.3
      target:
        device_id: 55783b7df92e11eabf886bf57f72e81e
    - action: media_player.play_media
      target:
        entity_id: media_player.living_room_speaker
      data:
        media_content_id: media-source://radio_browser/1b568695-9ce7-493d-ba72-d9b3d5e0a364
        media_content_type: audio/mpeg
      metadata:
        title: Evropa 2 - Radio
        thumbnail: https://m.actve.net/e2/favicon/apple-touch-icon.png
        media_class: music
        children_media_class:
        navigateIds:
