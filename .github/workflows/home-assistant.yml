---
name: Home Assistant CI

# yamllint disable-line rule:truthy
on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["**"]
  schedule:
    - cron: "0 6 * * *"

env:
  # Pin to a known-good stable release. Bump this when a newer
  # version passes check_config without the 'triggers' KeyError.
  HA_STABLE_VERSION: "2026.3.4"

jobs:
  prepare:
    name: Prepare config
    runs-on: ubuntu-latest
    steps:
      - name: Check out configuration from GitHub
        uses: actions/checkout@v4

      - name: Upload prepared config
        uses: actions/upload-artifact@v4
        with:
          name: ha-config
          path: .
          retention-days: 1

  stable:
    name: Home Assistant stable
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Download prepared config
        uses: actions/download-artifact@v8
        with:
          name: ha-config

      - name: Run Home Assistant Configuration Check
        uses: frenck/action-home-assistant@v1.4.1
        with:
          path: "."
          secrets: ./secrets.fake.yaml
          version: "${{ env.HA_STABLE_VERSION }}"

  beta:
    name: Home Assistant beta (informational)
    needs: prepare
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Download prepared config
        uses: actions/download-artifact@v8
        with:
          name: ha-config

      - name: Run Home Assistant Configuration Check
        uses: frenck/action-home-assistant@v1.4.1
        with:
          path: "."
          secrets: ./secrets.fake.yaml
          version: beta

      - name: Post beta result to PR
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '⚠️ **Home Assistant beta check failed.**\n\n' +
                'The config check against the HA **beta** release failed. ' +
                'This is informational — it may indicate upcoming breaking ' +
                'changes in the next HA release.\n\n' +
                `[View logs](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`
            });
