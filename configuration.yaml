---
# Configure a default setup of Home Assistant (frontend, api, etc)
default_config:

# Text to speech
tts:
  - platform: google_translate

# after last update no longer needed
# hydrawise:
#   access_token: !secret hydrawise_access_token

# binary_sensor:
#  - platform: hydrawise

# sensor:
#  - platform: hydrawise

# switch:
#  - platform: hydrawise

group: !include groups.yaml
automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml

# Lovelace dashboards in YAML mode (version-controlled)
# YAML dashboards are defined below; set your preferred one as default via HA UI
# Reload: Developer Tools → YAML → Dashboards
# Note: resource_mode: yaml required since HA 2026.2 (mode: yaml deprecated, removed in 2026.8)
lovelace:
  resource_mode: yaml
  resources:
    - url: /cardata/bmw-cardata-vehicle-card.js
      type: module
    - url: /hacsfiles/apexcharts-card/apexcharts-card.js
      type: module
    - url: /hacsfiles/flex-table-card/flex-table-card.js
      type: module
  dashboards:
    yaml-domov:
      mode: yaml
      filename: lovelace-domov.yaml
      title: Domov
      icon: mdi:home
      show_in_sidebar: true
    yaml-overview:
      mode: yaml
      filename: ui-lovelace.yaml
      title: Overview
      icon: mdi:view-dashboard
      show_in_sidebar: true
    yaml-location:
      mode: yaml
      filename: lovelace-location.yaml
      title: Location
      icon: mdi:map-marker
      show_in_sidebar: true

zha:
  zigpy_config:
    ota:
      otau_directory: /config/zigpy_ota
      ikea_provider: true
      inovelli_provider: false
      ledvance_provider: true
      salus_provider: false
      sonoff_provider: true
      thirdreality_provider: false

# samsung_soundbar: disabled temporarily — broken on HA 2026.3 (SUPPORT_PAUSE removed)
# TODO: fix media_player.py or wait for upstream update
# samsung_soundbar:
#   devices:
#     - name: Living room soundbar
#       api_key: !secret living_room_soundbar_api_key
#       device_id: !secret living_room_soundbar_device_id
#       max_volume: 100

api:

# zha_toolkit is now enabled through HACS custom components
# zha_toolkit:

# InfluxDB: connection details managed via UI (Settings → Devices & Services → InfluxDB)
# Removed host/port/database/username/password - migrated to UI in HA 2026.3 (required before 2026.9)
influxdb:
  max_retries: 3
  default_measurement: state

logger:
  default: warn  # info
#  logs:
#    homeassistant.components.zha: debug
#    zigpy: debug

homeassistant:
  customize: !include customize.yaml
  auth_mfa_modules:
    - type: totp
